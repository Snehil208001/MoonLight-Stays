# ===============================
# PRODUCTION (AWS Elastic Beanstalk + RDS)
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ===============================

# Elastic Beanstalk expects the app on port 5000
server.port=5000

# RDS env vars are auto-injected when RDS is linked to Elastic Beanstalk
# Manual RDS: set RDS_HOSTNAME, RDS_PORT, RDS_DB_NAME, RDS_USERNAME, RDS_PASSWORD
spring.datasource.url=jdbc:postgresql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}

# Production JPA settings
# update = create missing tables on first deploy; validate = use once schema exists
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable sample data seeding (avoids re-seeding on redeploy)
app.seed.enabled=false
# Seed when DB is empty (fresh deploy) so hotel search works
app.seed.on-empty-db=true

# Frontend URL for Stripe redirects. Set FRONTEND_URL in EB env
frontend.url=${FRONTEND_URL:http://localhost:3000}

# CORS: comma-separated production origins (e.g. https://your-app.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Secrets - set in Elastic Beanstalk Environment Properties
# JWT is required. Stripe has empty default so app starts (payments fail if not set).
jwt.secretKey=${JWT_SECRET_KEY}
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
