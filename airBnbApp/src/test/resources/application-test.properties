# Use H2 in-memory for tests - no PostgreSQL needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable seeding in tests
app.seed.enabled=false

# Dummy values for tests (JWT, Stripe, Mail - not used in contextLoads)
jwt.secretKey=test-secret-key-for-unit-tests-only
stripe.secret.key=sk_test_dummy
stripe.webhook.secret=whsec_dummy
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test
frontend.url=http://localhost:3000
