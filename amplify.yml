version: 1
applications:
  - appRoot: moonlight-stays
    env:
      variables:
        AMPLIFY_MONOREPO_APP_ROOT: moonlight-stays
        # Production backend URL - required for Amplify builds (override in Console if needed)
        NEXT_PUBLIC_API_URL: http://v2-0.eba-hk6i6byc.ap-south-1.elasticbeanstalk.com/api/v1
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
            - cp -r .next/static .next/standalone/.next/static
            - cp -r public .next/standalone/public 2>/dev/null || true
            - mkdir -p .amplify-hosting/compute/default
            - cp -a .next/standalone/. .amplify-hosting/compute/default/
            - cp deploy-manifest.json .amplify-hosting/
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
