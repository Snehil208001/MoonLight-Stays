version: 1
applications:
  - appRoot: moonlight-stays
    env:
      variables:
        AMPLIFY_MONOREPO_APP_ROOT: moonlight-stays
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
