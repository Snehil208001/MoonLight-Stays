version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd moonlight-stays
        - npm ci
    build:
      commands:
        - cd moonlight-stays
        - npm run build
  artifacts:
    baseDirectory: moonlight-stays/.next
    files:
      - '**/*'
  cache:
    paths:
      - moonlight-stays/node_modules/**/*
