# AWS CodeBuild buildspec - DISABLED (use manual deployment)
# CI/CD pipeline disabled to avoid exhausting AWS free tier.
# Use .\deploy-eb.ps1 and upload the zip manually. See MANUAL_DEPLOYMENT.md

version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  pre_build:
    commands:
      - echo "Building AirBnb Backend..."
      - cd airBnbApp
  build:
    commands:
      - mvn clean package -DskipTests
      - echo "Build completed"
  post_build:
    commands:
      - cp target/application.jar ../application.jar
      - cp Procfile ../Procfile
      - cp -r .ebextensions ../.ebextensions
      - cd ..
      # Removed the 'zip deploy.zip ...' command here

artifacts:
  files:
    - application.jar
    - Procfile
    - .ebextensions/01_environment.config
  # CodePipeline will automatically zip these two files together at the root level
  name: airbnb-backend-artifact

cache:
  paths:
    - airBnbApp/target/**/*
    - '${HOME}/.m2/**/*'
